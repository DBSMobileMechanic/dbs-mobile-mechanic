<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | DBS Mobile Mechanic</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        emailjs.init({
            publicKey: "YOUR_PUBLIC_KEY"
        });
    </script>

</head>
<body>

<header>
    <div class="logo">
        <h1>DBS Mobile Mechanic</h1>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Book</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="about">

<h2>Book Your Appointment</h2>

<form id="appointmentForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<input type="email" id="email" placeholder="Email">

<input type="text" id="vehicle" placeholder="Vehicle (Example: 2016 Ford F-150)" required>

<select id="service" required>
<option value="">Select Service</option>
<option>Brake Repair</option>
<option>Brake Bleeding</option>
<option>Oil Change</option>
<option>Battery Replacement</option>
<option>Alternator</option>
<option>Starter</option>
<option>Diagnostics</option>
<option>Suspension</option>
<option>Other</option>
</select>

<input type="date" id="date" required>

<input type="time" id="time" required>

<textarea id="message" rows="5" placeholder="Describe the problem"></textarea>

<button class="btn" type="submit">Book Appointment</button>

</form>

<div id="status"></div>

</section>

<script src="js/script.js"></script>

</body>
</html>

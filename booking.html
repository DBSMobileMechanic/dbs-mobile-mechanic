<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment | DBS Mobile Mechanic</title>

<link rel="stylesheet" href="style.css">

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init({
    publicKey: "XjSMneIvI9AWLLO2K"
});
</script>

</head>

<body>

<header>
    <div class="logo">
        <h1>DBS Mobile Mechanic</h1>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Book</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="about">

<h2>Schedule an Appointment</h2>

<form id="appointmentForm">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="tel"
name="phone"
placeholder="Phone Number"
required>

<input
type="email"
name="email"
placeholder="Email Address">

<input
type="text"
name="vehicle"
placeholder="Vehicle (Example: 2016 Ford F-150)"
required>

<select name="service" required>
<option value="">Select Service</option>
<option>Brake Repair</option>
<option>Brake Bleeding</option>
<option>Oil Change</option>
<option>Battery Replacement</option>
<option>Alternator Replacement</option>
<option>Starter Replacement</option>
<option>Diagnostics</option>
<option>Suspension Repair</option>
<option>Tire Service</option>
<option>Other</option>
</select>

<input
type="date"
name="date"
required>

<input
type="time"
name="time"
required>

<textarea
name="message"
rows="5"
placeholder="Describe the repair needed"></textarea>

<button class="btn" type="submit">
Book Appointment
</button>

</form>

<p id="status"></p>

</section>

<script>

const form = document.getElementById("appointmentForm");

form.addEventListener("submit", function(e){

e.preventDefault();

emailjs.sendForm(
"service_93lbhes",
"template_x3kevzp",
this
)

.then(function(){

document.getElementById("status").innerHTML =
"✅ Appointment request sent successfully!";

setTimeout(function(){

window.location.href="success.html";

},1500);

})

.catch(function(error){

console.log(error);

document.getElementById("status").innerHTML =
"❌ Failed to send appointment. Please try again.";

});

});

</script>

</body>
</html>
